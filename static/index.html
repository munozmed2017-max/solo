<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Solo</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <div>
      <h1>Solo</h1>
      <p class="tagline">Practice solo. Never alone.</p>
    </div>
    <div class="header-controls">
      <label class="flag-toggle">
        <input type="checkbox" id="demo-error-toggle">
        DEMO_PLANTED_ERROR
      </label>
      <button id="test-argon-btn" style="width:auto;">Test Argon</button>
      <span id="test-argon-result" class="muted"></span>
      <button id="reset-demo-btn" class="bad" style="width:auto;">Reset demo</button>
    </div>
  </header>

  <nav id="tabs">
    <button class="tab-btn active" data-tab="visits">Visits</button>
    <button class="tab-btn" data-tab="approvals">Approval queue</button>
    <button class="tab-btn" data-tab="activity">Activity log</button>
    <button class="tab-btn" data-tab="agent-builder">Agent builder</button>
    <button class="tab-btn" data-tab="results">Results</button>
    <button class="tab-btn" data-tab="practice">Practice setup</button>
    <button class="tab-btn" data-tab="booking">Booking page</button>
  </nav>

  <main id="tab-content"></main>

  <script src="/app.js"></script>
</body>
</html>
