<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book a visit</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    body { max-width: 560px; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
    .banner { background: #fef2f2; border: 1px solid var(--bad); color: var(--bad); padding: 0.7rem 1rem; border-radius: 6px; font-weight: 600; text-align: center; margin-bottom: 1.2rem; }
    .practice-header { text-align: center; margin-bottom: 1.2rem; }
    .practice-header h1 { margin: 0 0 0.2rem; font-size: 1.4rem; }
    footer.powered-by { text-align: center; margin-top: 2rem; color: var(--muted); font-size: 0.8rem; }
    .confirm { text-align: center; padding: 2rem 1rem; }
  </style>
</head>
<body>
  <div class="practice-header">
    <h1 id="practice-name">Loading...</h1>
    <p class="muted" id="practice-sub"></p>
  </div>
  <div class="banner">Use made-up information only.</div>

  <section class="panel" id="step1-section">
    <label>Full name</label>
    <input type="text" id="b-name" required>
    <label>Date of birth</label>
    <input type="date" id="b-dob" required>
    <label>Reason for visit</label>
    <textarea id="b-reason" rows="2" required></textarea>
    <button id="b-next">Next</button>
    <p id="b-error1" class="approved-no"></p>
  </section>

  <section class="panel" id="step2-section" style="display:none;">
    <div id="step2-questions"></div>
    <label>Attach a file (optional)</label>
    <input type="file" id="b-file">
    <button id="b-submit">Request visit</button>
    <p id="b-error2" class="approved-no"></p>
  </section>

  <section class="panel confirm" id="confirm-section" style="display:none;">
    <h2>Thanks!</h2>
    <p class="muted">Your visit request has been sent to the practice. You'll hear back soon.</p>
  </section>

  <footer class="powered-by">Powered by Solo</footer>

  <script>
    async function api(path, opts) {
      const res = await fetch(path, { headers: { "Content-Type": "application/json" }, ...opts });
      if (!res.ok) throw new Error(await res.text());
      return res.json();
    }

    (async () => {
      try {
        const practice = await api("/api/practice");
        document.getElementById("practice-name").textContent = practice.name;
        document.getElementById("practice-sub").textContent = "Request a telemedicine visit";
      } catch (e) {
        document.getElementById("practice-name").textContent = "Book a visit";
      }
    })();

    function questionField(q) {
      if (q.type === "yes_no") {
        return `<select id="q-${q.id}" data-qid="${q.id}"><option>No</option><option>Yes</option></select>`;
      }
      if (q.type === "scale_0_10") {
        return `<input type="number" min="0" max="10" id="q-${q.id}" data-qid="${q.id}">`;
      }
      return `<input type="text" id="q-${q.id}" data-qid="${q.id}">`;
    }

    document.getElementById("b-next").addEventListener("click", async () => {
      const name = document.getElementById("b-name").value.trim();
      const dob = document.getElementById("b-dob").value;
      const reason = document.getElementById("b-reason").value.trim();
      const errorEl = document.getElementById("b-error1");
      errorEl.textContent = "";
      if (!name || !dob || !reason) {
        errorEl.textContent = "Please fill in your name, date of birth, and reason for visit.";
        return;
      }
      const nextBtn = document.getElementById("b-next");
      nextBtn.disabled = true;
      nextBtn.textContent = "Loading questions...";
      let questions;
      try {
        const res = await api("/api/booking/intake-questions", {
          method: "POST",
          body: JSON.stringify({ reason }),
        });
        questions = res.questions;
      } catch (e) {
        questions = null;
      }
      nextBtn.disabled = false;
      nextBtn.textContent = "Next";
      if (!questions || !questions.length) {
        errorEl.textContent = "Could not load follow-up questions. Please try again.";
        return;
      }
      document.getElementById("step2-questions").innerHTML = questions
        .map((q) => `<label>${q.text}</label>${questionField(q)}`)
        .join("");
      document.getElementById("step1-section").style.display = "none";
      document.getElementById("step2-section").style.display = "block";
      document.getElementById("step2-section").dataset.name = name;
      document.getElementById("step2-section").dataset.dob = dob;
      document.getElementById("step2-section").dataset.reason = reason;
    });

    document.getElementById("b-submit").addEventListener("click", async () => {
      const section = document.getElementById("step2-section");
      const errorEl = document.getElementById("b-error2");
      const fileInput = document.getElementById("b-file");
      const uploaded_files = fileInput.files.length ? [fileInput.files[0].name] : [];
      const symptoms = {};
      section.querySelectorAll("[data-qid]").forEach((el) => {
        symptoms[el.dataset.qid] = el.value;
      });
      try {
        await api("/api/booking", {
          method: "POST",
          body: JSON.stringify({
            name: section.dataset.name,
            dob: section.dataset.dob,
            reason: section.dataset.reason,
            symptoms,
            uploaded_files,
          }),
        });
        section.style.display = "none";
        document.getElementById("confirm-section").style.display = "block";
      } catch (e) {
        errorEl.textContent = "Something went wrong submitting your request. Please try again.";
      }
    });
  </script>
</body>
</html>
